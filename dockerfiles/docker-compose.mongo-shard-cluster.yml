# https://www.mongodb.com/zh-cn/docs/manual/tutorial/deploy-shard-cluster/#std-label-sharding-procedure-setup
# https://www.cnblogs.com/likingzi/p/16556734.html
services:
  # Config Server (三节点副本集)
  mongodb-sharded-config-server-0:
    image: mongo:8.0
    hostname: mongodb-sharded-config-server-0
    command: mongod --configsvr --replSet configReplSet --bind_ip_all --port 27019
    volumes:
      - mongodb-sharded-config-server-0-data:/data/db
    healthcheck:
      test: mongosh --port 27019 --eval "db.runCommand('ping').ok" || exit 1
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s # 等待节点启动，给MongoDB更多的启动时间

  mongodb-sharded-config-server-1:
    image: mongo:8.0
    hostname: mongodb-sharded-config-server-1
    command: mongod --configsvr --replSet configReplSet --bind_ip_all --port 27019
    volumes:
      - mongodb-sharded-config-server-1-data:/data/db
    healthcheck:
      test: mongosh --port 27019 --eval "db.runCommand('ping').ok" || exit 1
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  mongodb-sharded-config-server-2:
    image: mongo:8.0
    hostname: mongodb-sharded-config-server-2
    command: mongod --configsvr --replSet configReplSet --bind_ip_all --port 27019
    volumes:
      - mongodb-sharded-config-server-2-data:/data/db
    healthcheck:
      test: mongosh --port 27019 --eval "db.runCommand('ping').ok" || exit 1
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Shard (三节点副本集)
  mongodb-sharded-shard-0:
    image: mongo:8.0
    hostname: mongodb-sharded-shard-0
    command: mongod --shardsvr --replSet shard1ReplSet --bind_ip_all --port 27020
    volumes:
      - mongodb-sharded-shard-0-data:/data/db
    healthcheck:
      test: mongosh --port 27020 --eval "db.runCommand('ping').ok" || exit 1
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  mongodb-sharded-shard-1:
    image: mongo:8.0
    hostname: mongodb-sharded-shard-1
    command: mongod --shardsvr --replSet shard1ReplSet --bind_ip_all --port 27020
    volumes:
      - mongodb-sharded-shard-1-data:/data/db
    healthcheck:
      test: mongosh --port 27020 --eval "db.runCommand('ping').ok" || exit 1
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  mongodb-sharded-shard-2:
    image: mongo:8.0
    hostname: mongodb-sharded-shard-2
    command: mongod --shardsvr --replSet shard1ReplSet --bind_ip_all --port 27020
    volumes:
      - mongodb-sharded-shard-2-data:/data/db
    healthcheck:
      test: mongosh --port 27020 --eval "db.runCommand('ping').ok" || exit 1
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Mongos 路由服务
  mongodb-sharded-mongos:
    image: mongo:8.0
    hostname: mongodb-sharded-mongos
    ports:
      - "27017:27017"
    command: >
      bash -c "
        echo 'Waiting for config servers to be ready...' &&
        until mongosh --host mongodb-sharded-config-server-0:27019 --eval 'db.runCommand( { ping: 1 } ).ok' --quiet; do
          sleep 5;
        done &&
        echo 'Initializing config server replica set...' &&
        mongosh --host mongodb-sharded-config-server-0:27019 --eval '
          rs.initiate({
            _id: \"configReplSet\",
            configsvr: true,
            members: [
              { _id: 0, host: \"mongodb-sharded-config-server-0:27019\" },
              { _id: 1, host: \"mongodb-sharded-config-server-1:27019\" },
              { _id: 2, host: \"mongodb-sharded-config-server-2:27019\" }
            ]
          })
        ' &&
        echo 'Waiting for config replica set to elect primary...' &&
        until mongosh --host mongodb-sharded-config-server-0:27019 --eval 'rs.status().myState === 1' --quiet; do
          sleep 5;
        done &&
        echo 'Waiting for shard servers to be ready...' &&
        until mongosh --host mongodb-sharded-shard-0:27020 --eval 'db.runCommand( { ping: 1 } ).ok' --quiet; do
          sleep 5;
        done &&
        echo 'Initializing shard replica sets...' &&
        mongosh --host mongodb-sharded-shard-0:27020 --eval '
          rs.initiate({
            _id: \"shard1ReplSet\",
            members: [
              { _id: 0, host: \"mongodb-sharded-shard-0:27020\" },
              { _id: 1, host: \"mongodb-sharded-shard-1:27020\" },
              { _id: 2, host: \"mongodb-sharded-shard-2:27020\" }
            ]
          })
        ' &&
        echo 'Waiting for shard replica set to elect primary...' &&
        until mongosh --host mongodb-sharded-shard-0:27020 --eval 'rs.status().myState === 1' --quiet; do
          sleep 5;
        done &&
        echo 'Starting mongos...' &&
        mongos --configdb configReplSet/mongodb-sharded-config-server-0:27019,mongodb-sharded-config-server-1:27019,mongodb-sharded-config-server-2:27019 --bind_ip_all --port 27017 &
        sleep 5 &&
        echo 'Adding shard to cluster...' &&
        until mongosh --host localhost:27017 --eval 'sh.addShard(\"shard1ReplSet/mongodb-sharded-shard-0:27020\")'; do
          sleep 5;
        done &&
        echo 'MongoDB sharded cluster is ready!' &&
        tail -f /dev/null
      "
    # command: mongos --configdb configReplSet/mongodb-sharded-config-server-0:27019,mongodb-sharded-config-server-1:27019,mongodb-sharded-config-server-2:27019 --bind_ip_all --port 27017
    depends_on:
      mongodb-sharded-config-server-0:
        condition: service_healthy
      mongodb-sharded-config-server-1:
        condition: service_healthy
      mongodb-sharded-config-server-2:
        condition: service_healthy
      mongodb-sharded-shard-0:
        condition: service_healthy
      mongodb-sharded-shard-1:
        condition: service_healthy
      mongodb-sharded-shard-2:
        condition: service_healthy

volumes:
  mongodb-sharded-config-server-0-data:
  mongodb-sharded-config-server-1-data:
  mongodb-sharded-config-server-2-data:
  mongodb-sharded-shard-0-data:
  mongodb-sharded-shard-1-data:
  mongodb-sharded-shard-2-data:
