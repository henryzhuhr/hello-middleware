services:
  # Milvus 单机版(standalone)
  milvus-standalone:
    image: milvusdb/milvus:v2.5.4 # https://hub.docker.com/r/milvusdb/milvus
    platform: linux/amd64  # milvus docker 貌似暂时没支持 arm64
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    depends_on:
      - "milvus-etcd"
      - "milvus-minio"
    ports:
      - "19530:19530"
      - "9091:9091"
    networks:
      - default
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
  
  # Milvus 依赖的 Etcd
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    networks:
      - default
    volumes:
      - milvus_etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Milvus 依赖的 Minio
  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - milvus_minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Milvus 的可视化管理工具 Attu
  milvus-attu:
    image: zilliz/attu:v2.4
    environment:
      MILVUS_URL: milvus-standalone:19530
    ports:
      - "8000:3000" # 访问地址 http://localhost:8000
    depends_on:
      - "milvus-standalone"
    networks:
      - default

      
# -- 网络名称，用于容器间通信
networks:
  default:
    name: hello-middleware-network
  

# -- 数据卷名称，用于持久化数据
volumes:
  milvus_data:  # 添加Milvus的数据卷
  milvus_etcd_data:  # 添加Milvus的Etcd数据卷
  milvus_minio_data:  # 添加Milvus的Minio数据卷