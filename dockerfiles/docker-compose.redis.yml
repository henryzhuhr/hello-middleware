services:
  # Redis
  redis-server:
    image: redis:8 # https://hub.docker.com/_/redis
    networks:
      - default
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s # 等待 Redis 启动完成